AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calorie Tracker - Serverless Personal Project
Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.14
    Environment:
      Variables:
        TABLE_NAME:
          Ref: CalorieTrackerTable
        API_KEY: my_secret_token_123
        BASELINE_CALS: '1800'
        PROTEIN_GOAL: '80'
        GYM_GOAL: '2'
        MEALS_TABLE:
          Ref: SavedMealsTable
Resources:
  CalorieTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CalorieTracker
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
  SavedMealsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SavedMeals
      AttributeDefinitions:
      - AttributeName: MealName
        AttributeType: S
      KeySchema:
      - AttributeName: MealName
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  TrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: TrackerFunction
      Handler: lambda_function.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CalorieTrackerTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SavedMealsTable
      Events:
        LogData:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: MyApi
            Path: /log
            Method: POST
        GetData:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: MyApi
            Path: /data
            Method: GET
        MealPost:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: MyApi
            Path: /meals
            Method: POST
        MealGet:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: MyApi
            Path: /meals
            Method: GET
        MealDelete:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: MyApi
            Path: /meals
            Method: DELETE
        ConfigPost:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: MyApi
            Path: /config
            Method: POST
        ConfigGet:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: MyApi
            Path: /config
            Method: GET
    Metadata:
      SamResourceId: TrackerFunction
  MyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - x-api-key
        AllowOrigins:
        - '*'
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: calorie-dashboard-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${DashboardBucket}/*
Outputs:
  ApiUrl:
    Description: API Endpoint
    Value:
      Fn::Sub: https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com
  DashboardUrl:
    Description: Dashboard URL
    Value:
      Fn::GetAtt:
      - DashboardBucket
      - WebsiteURL
