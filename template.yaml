AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calorie Tracker - Serverless Personal Project

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.14
    Environment:
      Variables:
        TABLE_NAME: !Ref CalorieTrackerTable
        API_KEY: "my_secret_token_123"
        BASELINE_CALS: "1800"
        PROTEIN_GOAL: "80"
        GYM_GOAL: "2"
        MEALS_TABLE: !Ref SavedMealsTable
        TOTP_SECRET: "JBSWY3DPEHPK3PXP"

Resources:
  # 1. DynamoDB Table
  CalorieTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CalorieTracker
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # 1b. Saved Meals Table
  SavedMealsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SavedMeals
      AttributeDefinitions:
        - AttributeName: MealName
          AttributeType: S
      KeySchema:
        - AttributeName: MealName
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # 2. Lambda Function
  TrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CalorieTrackerTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedMealsTable
      Events:
        LogData:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /log
            Method: POST
        GetData:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /data
            Method: GET
        MealPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /meals
            Method: POST
        MealGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /meals
            Method: GET
        MealDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /meals
            Method: DELETE
        LogDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /log
            Method: DELETE
        ConfigPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /config
            Method: POST
        ConfigGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /config
            Method: GET
        VerifyTotp:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /verify-totp
            Method: POST
        TrustDevicePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /trust-device
            Method: POST
        TrustDeviceGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyApi
            Path: /trust-device
            Method: GET

  # 1c. Explicit HttpApi with CORS and Rate Limiting
  MyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - x-api-key
        AllowOrigins:
          - "*"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  # 3. S3 Bucket for Dashboard
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "calorie-dashboard-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 4. CloudFront Function for Security Headers
  SecurityHeadersFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-SecurityHeaders"
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          var headers = response.headers;
          
          headers['strict-transport-security'] = { value: 'max-age=31536000; includeSubDomains; preload' };
          headers['x-content-type-options'] = { value: 'nosniff' };
          headers['x-frame-options'] = { value: 'DENY' };
          headers['x-xss-protection'] = { value: '1; mode=block' };
          headers['referrer-policy'] = { value: 'strict-origin-when-cross-origin' };
          headers['permissions-policy'] = { value: 'geolocation=(), microphone=(), camera=()' };
          headers['content-security-policy'] = { value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self' https://*.execute-api.eu-west-2.amazonaws.com; frame-ancestors 'none'" };
          
          return response;
        }
      FunctionConfig:
        Comment: "Adds security headers to responses"
        Runtime: cloudfront-js-2.0

  # 5. CloudFront Origin Access Control
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 6. CloudFront Distribution (HTTPS)
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
          DefaultTTL: 86400
          MinTTL: 0
          MaxTTL: 31536000
          FunctionAssociations:
            - EventType: viewer-response
              FunctionARN: !GetAtt SecurityHeadersFunction.FunctionMetadata.FunctionARN
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # 7. S3 Bucket Policy for CloudFront Access
  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${DashboardBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

Outputs:
  ApiUrl:
    Description: "API Endpoint"
    Value: !Sub "https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com"
  DashboardUrl:
    Description: "Dashboard URL (HTTPS via CloudFront)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  CloudFrontDomain:
    Description: "CloudFront Domain Name"
    Value: !GetAtt CloudFrontDistribution.DomainName
