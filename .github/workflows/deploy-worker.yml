name: Deploy Fitness Worker

on:
  push:
    branches:
      - main
    paths:
      - 'fitness-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Cloudflare API Token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [[ "$CLOUDFLARE_API_TOKEN" == "Bearer "* ]] || \
             [[ "$CLOUDFLARE_API_TOKEN" == \"* ]] || \
             [[ "$CLOUDFLARE_API_TOKEN" == \'* ]] || \
             [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN has an invalid format. Store only the raw token, without 'Bearer ', quotes, or whitespace."
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"

          if [[ "$http_status" != "200" ]] || ! jq -e '.success == true and .result.status == "active"' "$response_file" > /dev/null; then
            error_message="$(jq -r '.errors[0].message // "Token is invalid, expired, or unauthorized"' "$response_file" 2>/dev/null || echo "Token verification failed")"
            echo "::error::Cloudflare API token verification failed (HTTP $http_status): $error_message"
            exit 1
          fi

          echo "Cloudflare API token is active."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fitness-worker/package-lock.json

      - name: Install Dependencies
        working-directory: fitness-worker
        run: npm ci

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '5c577942cabb36069967e1e7efed4b25'
          workingDirectory: 'fitness-worker'
          wranglerVersion: '4.118.0'
          command: deploy --config wrangler.toml
