name: Deploy Fitness Worker

on:
  push:
    branches:
      - main
    paths:
      - 'fitness-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fitness-worker/package-lock.json

      - name: Install Dependencies
        working-directory: fitness-worker
        run: npm ci

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '5c577942cabb36069967e1e7efed4b25'
          workingDirectory: 'fitness-worker'
          wranglerVersion: '4.118.0'
          command: deploy --config wrangler.toml
